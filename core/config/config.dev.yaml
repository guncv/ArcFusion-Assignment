workflow:
  orchestration_max_attempts: 2

clarification_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

intent_analysis_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 200

smalltalk_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

needs_more_detail_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

refined_query_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1000

rag_synthesizer_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.2
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1500

rag_reflection_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

planner_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.3
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

orchestration_synthesizer_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.3
  api_key: ${OPENAI_API_KEY}
  max_tokens: 2500

orchestration_reflection_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 800
  max_synthesis_attempts: 2

langsmith:
  enabled: false
  api_key: "${LANGCHAIN_API_KEY}"
  project_name: "ArcFusionGraph"
  endpoint: "https://eu.api.smith.langchain.com"

tools:
  enabled: true
  custom_tools:
    - say_hello
    - calculator

api:
  title: "ArcFusion API - Dev"
  version: "1.0.0-dev"
  prefix: "/api/v1"
  port: 8000

vector_db:
  collection_name: "arcfusion_docs"
  embedding_model: "text-embedding-3-small"
  kind: "${VECTOR_DB:chroma}"
  embedder_api_key: "${OPENAI_API_KEY}"
  chroma:
    persist_directory: "${VECTOR_DB_PERSIST_DIR:./.chroma}"
  pinecone:
    api_key: "${PINECONE_API_KEY}"
    environment: "${PINECONE_ENV:us-east-1-aws}"
    index_name: "${PINECONE_IDX_NAME:arc-fusion-dev}"
    dimensions: "${PINECONE_DIMS:1536}"
    metric: "${PINECONE_METRIC:cosine}"
    cloud: "${PINECONE_CLOUD:aws}"
    region: "${PINECONE_REGION:us-east-1}"

rag:
  auto_ingestion:
    enabled: true
    documents_directory: ["./documents"]
    clear_existing: false
    on_startup: true

  embedding_model: "text-embedding-3-small"
  embedding_api_key: "${OPENAI_API_KEY}"
    
  chunking:
    chunk_size: 300
    chunk_overlap: 50
    separators: null
    strategy: "semantic_llamaindex"
    semantic_model: "text-embedding-3-small"
    semantic_similarity_threshold: 0.7
    semantic_min_chunk_size: null
    llamaindex_buffer_size: 1
    llamaindex_breakpoint_threshold: 85

  retrieval:
    top_k: 5
    vector_weight: 0.7
    bm25_weight: 0.3
    use_ensemble: true
    use_reranker: true
    reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    reranker_top_n: 5

  confidence_evaluation:
    min_confidence_threshold: 0.6
    min_documents_threshold: 2
    avg_score_threshold: 0.5

  web_search:
    enabled: true
    api_key: "${TAVILY_API_KEY}"
    max_results: 3
    search_depth: "advanced"

  generation:
    llm_type: "refined_query_agent"
    max_context_length: 4000

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

chat_history:
  backend: "redis"
  ttl: 3600

  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    db: "${REDIS_DB:0}"
    password: "${REDIS_PASSWORD:}"
    key_prefix: "chat_history:"

  file:
    persist_dir: "./data/chat_history"

langsmith:
  enabled: ${LANGCHAIN_TRACING_V2:false}
  api_key: ${LANGCHAIN_API_KEY:}
  project_name: ${LANGCHAIN_PROJECT:arcfusion-dev}
  endpoint: ${LANGCHAIN_ENDPOINT:https://api.smith.langchain.com}
