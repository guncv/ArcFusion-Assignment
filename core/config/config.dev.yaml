router_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 100

smalltalk_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

clarification_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

needs_more_detail_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

refined_query_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1000

tools:
  enabled: true
  custom_tools:
    - say_hello
    - calculator

api:
  title: "ArcFusion API - Dev"
  version: "1.0.0-dev"
  prefix: "/api/v1"
  port: 8000

vector_db:
  collection_name: "arcfusion_docs"
  embedding_model: "text-embedding-3-small"
  kind: "${VECTOR_DB:chroma}"
  embedder_api_key: "${OPENAI_API_KEY}"
  chroma:
    persist_directory: "${VECTOR_DB_PERSIST_DIR:./.chroma}"
  pinecone:
    api_key: "${PINECONE_API_KEY}"
    environment: "${PINECONE_ENV:us-east-1-aws}"
    index_name: "${PINECONE_IDX_NAME:arc-fusion-dev}"
    dimensions: "${PINECONE_DIMS:1536}"
    metric: "${PINECONE_METRIC:cosine}"
    cloud: "${PINECONE_CLOUD:aws}"
    region: "${PINECONE_REGION:us-east-1}"

rag:
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
    separators: null

  retrieval:
    top_k: 5
    vector_weight: 0.7
    bm25_weight: 0.3
    use_ensemble: true

  web_search:
    enabled: true
    api_key: "${TAVILY_API_KEY}"
    max_results: 5
    search_depth: "advanced"

  generation:
    llm_type: "refined_query_agent"
    max_context_length: 4000

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

chat_history:
  backend: "redis"
  ttl: 3600

  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    db: "${REDIS_DB:0}"
    password: "${REDIS_PASSWORD:}"
    key_prefix: "chat_history:"

  file:
    persist_dir: "./data/chat_history"