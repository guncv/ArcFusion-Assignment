router_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 100

smalltalk_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

clarification_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

needs_more_detail_agent:
  model: gpt-3.5-turbo
  api_provider: openai
  temperature: 0.5
  api_key: ${OPENAI_API_KEY}
  max_tokens: 500

refined_query_agent:
  model: gpt-4o-mini
  api_provider: openai
  temperature: 0.0
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1000

tools:
  enabled: true
  custom_tools:
    - say_hello
    - calculator

api:
  title: "ArcFusion API - Dev"
  version: "1.0.0-dev"
  prefix: "/api/v1"
  port: 8000

vector_db:
  kind: "${VECTOR_DB:chroma}"
  embedder_api_key: "${VECTOR_DB_EMBEDDER_API_KEY}"
  chroma:
    persist_directory: "${VECTOR_DB_PERSIST_DIR:./.chroma}"
  pinecone:
    api_key: "${PINECONE_API_KEY}"
    environment: "${PINECONE_ENV:us-east-1-aws}"
    index_name: "${PINECONE_IDX_NAME:arc-fusion-dev}"
    dimensions: "${PINECONE_DIMS:1536}"
    metric: "${PINECONE_METRIC:cosine}"
    cloud: "${PINECONE_CLOUD:aws}"
    region: "${PINECONE_REGION:us-east-1}"

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

chat_history:
  backend: "redis"  # Options: redis, postgres, file
  ttl: 3600  # Session TTL in seconds (1 hour)

  # Redis configuration
  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    db: "${REDIS_DB:0}"
    password: "${REDIS_PASSWORD:}"
    key_prefix: "chat_history:"

  # Fallback file storage (dev only)
  file:
    persist_dir: "./data/chat_history"