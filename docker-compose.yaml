services:
  arc-fusion-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/src
    environment:
      - ENV=dev
    env_file:
      - .env.dev
    networks:
      - arc-fusion-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: arcfusion-postgres
    environment:
      POSTGRES_USER: arcfusion
      POSTGRES_PASSWORD: arcfusion_dev_password
      POSTGRES_DB: arcfusion
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - arc-fusion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-volume:
    driver: local

networks:
  arc-fusion-network:
    driver: bridge